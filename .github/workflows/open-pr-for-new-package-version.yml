name: Open PR on New Release

on:
  repository_dispatch:
    types: [new-release]

jobs:
  open-pr:
    name: Bump package version
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install base tools
        run: pacman -S --noconfirm --needed git sudo curl

      - uses: actions/checkout@v5

      - name: Setup git identity
        run: |
          git config --global user.name  "Mohamed Amine Zghal"
          git config --global user.email "medaminezghal@outlook.com"
          git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve package name
        id: resolve
        run: |
          provider="${{ github.event.client_payload.provider }}"
          project="${{ github.event.client_payload.project }}"
          version="${{ github.event.client_payload.version }}"

          pkgver="${version#v}"

          if [[ "$pkgver" =~ [a-zA-Z] ]]; then
            echo "Skipping pre-release version: $pkgver"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$provider" in
            pypi|github|gitlab) pkgname="$(echo "${project##*/}" | tr '[:upper:]' '[:lower:]')" ;;
            *)
              echo "::error::Unsupported provider: $provider"
              exit 1
              ;;
          esac

          found=$(find . -maxdepth 1 -type d -name "*$pkgname" | head -n1 | sed 's|^\./||')
          pkgname="${found:-$pkgname}"

          if [[ ! -d "$pkgname" || ! -f "$pkgname/PKGBUILD" ]]; then
            echo "Package '$pkgname' not in repo yet, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false"    >> "$GITHUB_OUTPUT"
          echo "pkgname=$pkgname" >> "$GITHUB_OUTPUT"
          echo "pkgver=$pkgver"   >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "Resolved: $pkgname $pkgver (provider: $provider)"

      - name: Bump version and update checksums
        id: bump
        if: steps.resolve.outputs.skip == 'false'
        run: |
          pkgname="${{ steps.resolve.outputs.pkgname }}"
          pkgver="${{ steps.resolve.outputs.pkgver }}"
          pkgdir="$GITHUB_WORKSPACE/$pkgname"

          current_pkgver=$(bash -c "source $pkgdir/PKGBUILD && echo \$pkgver")
          current_pkgrel=$(bash -c "source $pkgdir/PKGBUILD && echo \$pkgrel")

          # Skip if the incoming version is older than (or equal to) what's already packaged.
          # vercmp returns: <0 if $1 < $2, 0 if equal, >0 if $1 > $2
          cmp=$(vercmp "$pkgver" "$current_pkgver")

          if (( cmp < 0 )); then
            echo "Incoming version $pkgver is older than current $current_pkgver, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( cmp == 0 )); then
            new_pkgrel=$((current_pkgrel + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$new_pkgrel/" "$pkgdir/PKGBUILD"
            echo "bump_type=checksum" >> "$GITHUB_OUTPUT"
            echo "Same version, incrementing pkgrel to $new_pkgrel"
          else
            sed -i "s/^pkgver=.*/pkgver=$pkgver/" "$pkgdir/PKGBUILD"
            sed -i "s/^pkgrel=.*/pkgrel=1/"       "$pkgdir/PKGBUILD"
            echo "bump_type=version" >> "$GITHUB_OUTPUT"
            echo "New version: $current_pkgver → $pkgver"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          tmpdir=$(mktemp -d)
          cp "$pkgdir"/* "$tmpdir/"
          useradd -m tmpbuilder
          chown -R tmpbuilder:tmpbuilder "$tmpdir"
          new_checksums=$(sudo -u tmpbuilder bash -c "cd \"$tmpdir\" && makepkg -g")

          if [[ -n "$new_checksums" ]]; then
            cd "$pkgdir"
            awk -v new="$new_checksums" '
              /^sha[0-9a-z]*sums(_[a-z0-9_]+)?=/ {
                if (!inserted) {
                  print new
                  inserted=1
                }
                in_block=1
                if (/\)$/) in_block=0
                next
              }
              in_block {
                if (/\)/) in_block=0
                next
              }
              { print }
            ' PKGBUILD > PKGBUILD.tmp && mv PKGBUILD.tmp PKGBUILD
          else
            echo "No generic sources to checksum, keeping existing checksums."
          fi

      - name: Create pull request
        if: steps.resolve.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          branch: bump/${{ steps.resolve.outputs.pkgname }}-${{ steps.resolve.outputs.pkgver }}
          commit-message: "${{ steps.resolve.outputs.pkgname }}: Update to version ${{ steps.resolve.outputs.pkgver }}"
          title: "${{ steps.resolve.outputs.pkgname }}: Update to version ${{ steps.resolve.outputs.pkgver }}"
          body: |
            Automated version bump triggered by newreleases.io

            | Field | Value |
            |---|---|
            | Package | `${{ steps.resolve.outputs.pkgname }}` |
            | Provider | `${{ steps.resolve.outputs.provider }}` |
            | New version | `${{ steps.resolve.outputs.pkgver }}` |
            | Bump type | `${{ steps.bump.outputs.bump_type }}` |
            | Release time | `${{ github.event.client_payload.time }}` |

            The PKGBUILD CI will run automatically on this PR.
          labels: automated, version-bump
          delete-branch: true
