name: Notify Claude routine

on:
  workflow_run:
    workflows: ["Build and check in clean chroot", "Publish to AUR"]
    types: [completed]
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "**/PKGBUILD"

# Debounce: a new event cancels the one still waiting below, so a burst of
# events (merges, update-branch rebuilds, failures) starts a single routine run.
concurrency:
  group: notify-claude
  cancel-in-progress: true

jobs:
  fire:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
       !startsWith(github.event.workflow_run.head_branch, 'claude/') &&
       github.event.workflow_run.head_branch != 'bump/add-python-pydantic-ai' &&
       github.event.workflow_run.head_branch != 'bump/add-python-livekit-agents') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Wait for more events
        run: sleep 600
      - name: Fire routine
        env:
          URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          EVENT: ${{ github.event_name }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_RUN: ${{ github.event.workflow_run.html_url }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            TEXT="Workflow '$WF_NAME' failed on branch $WF_BRANCH: $WF_RUN"
          else
            TEXT="PR #$PR_NUM merged into main: $PR_TITLE"
          fi
          TEXT="$TEXT (latest of possibly several events in the last 10 minutes)"
          jq -n --arg text "$TEXT" '{text: $text}' |
          curl -sS --fail -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data-binary @-
