name: STRUMPACK self-hosted build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strumpack:
    name: Build and test STRUMPACK 8.1.0
    runs-on: [self-hosted, linux, x64, strumpack-arch]
    timeout-minutes: 360

    steps:
      - name: Check out the exact PR revision
        uses: actions/checkout@v4
        with:
          ref: 1149f5df6cf234db4888569e39fe9c22f6555c9d
          persist-credentials: false

      - name: Verify build dependencies
        run: |
          set -euo pipefail
          missing=$(pacman -T \
            base-devel git cmake gcc gcc-fortran openmpi \
            blas lapack scalapack metis parmetis scotch zfp \
            butterflypack combblas)
          if [[ -n "$missing" ]]; then
            printf 'Missing package dependencies:\n%s\n' "$missing"
            exit 1
          fi
          echo "All declared build dependencies are installed."
          git rev-parse HEAD

      - name: Build package and run check()
        working-directory: strumpack
        run: |
          set -o pipefail
          makepkg --cleanbuild --nodeps --noconfirm 2>&1 | tee ../strumpack-makepkg.log

      - name: Upload build log and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strumpack-self-hosted-${{ github.run_id }}
          path: |
            strumpack-makepkg.log
            strumpack/*.pkg.tar.*
          if-no-files-found: warn
          retention-days: 14
