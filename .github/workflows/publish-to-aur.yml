name: Publish to AUR

on:
  push:
    branches: [main]
    paths:
      - "*/PKGBUILD"

jobs:
  publish:
    name: Push to AUR
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install base tools
        run: pacman -S --noconfirm --needed git openssh gnupg sudo

      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Find changed package
        id: pkg
        run: |
          git config --global safe.directory "$GITHUB_WORKSPACE"

          dir=$(git diff-tree --no-commit-id -r --name-only HEAD^1 HEAD \
                  -- '*/PKGBUILD' \
                | head -n1 \
                | sed 's|/PKGBUILD||')

          [[ -n "$dir" ]] || { echo "::error::No PKGBUILD change detected"; exit 1; }
          [[ -f "$dir/PKGBUILD" ]] || { echo "::error::$dir/PKGBUILD not found"; exit 1; }

          pkgname=$(bash -c "source $dir/PKGBUILD && echo \$pkgname")
          pkgver=$(bash -c "source $dir/PKGBUILD && echo \$pkgver")

          [[ -n "$pkgname" ]] || { echo "::error::Could not read pkgname from PKGBUILD"; exit 1; }

          echo "dir=$dir"         >> "$GITHUB_OUTPUT"
          echo "pkgname=$pkgname" >> "$GITHUB_OUTPUT"
          echo "pkgver=$pkgver"   >> "$GITHUB_OUTPUT"
          echo "Package: $pkgname $pkgver (dir: $dir)"

      - name: Setup SSH
        run: |
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur

          ssh-keyscan -t rsa,ed25519 aur.archlinux.org >> /root/.ssh/known_hosts
          chmod 600 /root/.ssh/known_hosts

          echo "Host aur.archlinux.org" >> /root/.ssh/config
          echo "  IdentityFile /root/.ssh/aur" >> /root/.ssh/config
          echo "  User aur" >> /root/.ssh/config

          eval $(ssh-agent)
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          ssh-add /root/.ssh/aur <<< "${{ secrets.PASSPHRASE }}"

      - name: Setup GPG
        run: |
          mkdir -p /root/.gnupg
          chmod 700 /root/.gnupg

          echo "pinentry-mode loopback" >> /root/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> /root/.gnupg/gpg-agent.conf

          echo "${{ secrets.GPG_PRIVATE_KEY }}" \
            | gpg --batch \
                  --passphrase "${{ secrets.PASSPHRASE }}" \
                  --import

          fingerprint=$(gpg --list-secret-keys --keyid-format LONG \
            | grep sec \
            | head -n1 \
            | awk '{print $2}' \
            | cut -d'/' -f2)

          git config --global user.signingkey "$fingerprint"
          git config --global commit.gpgsign true
          git config --global gpg.program gpg

          gpgconf --kill gpg-agent
          gpg-agent --daemon --allow-preset-passphrase --allow-loopback-pinentry
          keygrip=$(gpg --list-secret-keys --with-keygrip \
            | grep Keygrip \
            | head -n1 \
            | awk '{print $3}')
          /usr/lib/gnupg/gpg-preset-passphrase --preset "$keygrip" <<< "${{ secrets.PASSPHRASE }}"

          echo "GPG key imported: $fingerprint"

      - name: Setup git identity
        run: |
          git config --global user.name  "Mohamed Amine Zghal"
          git config --global user.email "medaminezghal@outlook.com"
          git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Generate .SRCINFO
        run: |
          useradd -m srcbuilder
          chown -R srcbuilder:srcbuilder "$GITHUB_WORKSPACE/${{ steps.pkg.outputs.dir }}"
          sudo -u srcbuilder bash -c "cd \"$GITHUB_WORKSPACE/${{ steps.pkg.outputs.dir }}\" && makepkg --printsrcinfo > .SRCINFO"

      - name: Push to AUR
        run: |
          pkgname="${{ steps.pkg.outputs.pkgname }}"
          pkgver="${{ steps.pkg.outputs.pkgver }}"
          dir="$GITHUB_WORKSPACE/${{ steps.pkg.outputs.dir }}"
          aur_dir="/tmp/aur-$pkgname"

          git -c init.defaultBranch=master clone "ssh://aur@aur.archlinux.org/${pkgname}.git" "$aur_dir"
          git config --global safe.directory "$aur_dir"

          cp "$dir/PKGBUILD"  "$aur_dir/"
          cp "$dir/.SRCINFO"  "$aur_dir/"

          find "$dir" -maxdepth 1 -type f \
            ! -name 'PKGBUILD' \
            ! -name '.SRCINFO' \
            ! -name '*.pkg.tar.*' \
            ! -name '*.log' \
            -exec cp {} "$aur_dir/" \;

          cd "$aur_dir"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to push to AUR."
            exit 0
          fi

          echo "=== git log ==="
          git log --oneline -5
          echo "=== HEAD message ==="
          git log -1 --pretty=%B HEAD
          echo "==============="

          commit_msg=$(git log -1 --pretty=%s | sed 's/^[^:]*: //')
          git commit \
            -S \
            -m "$commit_msg"
          git push
          echo "Successfully pushed $pkgname $pkgver to AUR."
