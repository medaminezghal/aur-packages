name: Build and check in clean chroot

on:
  pull_request:
    branches: [main]
    paths:
      - "*/PKGBUILD"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      package:
        description: Directory of PKGBUILD
        type: string
        required: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/greyltc-org/archlinux-aur:paru
      options: --privileged --cgroupns=host
      volumes:
        - /etc/machine-id:/etc/machine-id:ro
        - /run/dbus:/run/dbus

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install base tools
        run: pacman -S --noconfirm --needed git sudo devtools

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup chroot via paru
        run: |
          sed -i -E 's/^#(Chroot)/\1/' /etc/paru.conf
          # for systemd-nspawn
          echo 'ab ALL=(ALL:ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Fetch base branch
        if: '!inputs.package'
        run: |
          git config --global safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }}

      - name: Find changed package
        id: pkg
        if: '!inputs.package'
        run: |
          dir=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                  -- '*/PKGBUILD' \
                | head -n1 \
                | sed 's|/PKGBUILD||')

          if [[ -z "$dir" ]]; then
            echo "No PKGBUILD changes, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f "$dir/PKGBUILD" ]]; then
            echo "PKGBUILD deleted — skipping build check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Package to build: $dir"

      - name: Build & Test package
        if: steps.pkg.outputs.skip != 'true'
        env:
          PKG: ${{ inputs.package || steps.pkg.outputs.dir }}
        run: |
          chown -R ab:ab "$GITHUB_WORKSPACE"
          sudo -u ab -D "$GITHUB_WORKSPACE/$PKG" paru -B . --noconfirm

      - name: Write result summary
        if: always()
        uses: actions/github-script@v8
        env:
          PKG: ${{ inputs.package || steps.pkg.outputs.dir }}
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const pkg     = process.env.PKG || 'unknown';
            const icon    = success ? '✅' : '❌';
            const status  = success ? 'Build and tests passed' : 'Build or tests failed';
            const message = `## ${icon} PKGBUILD CI — ${status}

            **Package:** \`${pkg}\`
            *Commit: ${{ github.sha }}*`;

            core.summary.addRaw(message);
            core.summary.addEOL();
            await core.summary.write();
